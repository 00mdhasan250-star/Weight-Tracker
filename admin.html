<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA MINING - Admin Secure Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#040b16',
                        midnight: '#0a1122',
                        card: '#11192b',
                        electric: '#00f0ff',
                        violet: '#8b5cf6',
                        emerald: '#00ff87',
                        danger: '#ff3366',
                        textMuted: '#94a3b8'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #040b16; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .hide { display: none !important; }
        
        .glass-panel { background: rgba(17, 25, 43, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .admin-card { background: #11192b; border: 1px solid rgba(255,255,255,0.05); border-radius: 1rem; }
        
        .sidebar-item { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.03); color: #fff; }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(0, 240, 255, 0.1) 0%, rgba(0,0,0,0) 100%); color: #00f0ff; border-left: 3px solid #00f0ff; }

        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { text-align: left; padding: 1rem; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        td { padding: 1rem; font-size: 0.875rem; border-bottom: 1px solid rgba(255,255,255,0.02); }

        .input-dark { background: #0a1122; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 0.5rem; padding: 0.75rem 1rem; width: 100%; }
        .input-dark:focus { outline: none; border-color: #00f0ff; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen w-full">

    <div id="toast" class="fixed top-6 right-6 z-[200] bg-card border border-gray-700 text-white px-6 py-4 rounded-xl shadow-xl transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-3">
        <i data-lucide="info" class="w-5 h-5 text-electric"></i><span id="toast-msg" class="font-medium">Notice</span>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="absolute inset-0 z-50 flex items-center justify-center bg-navy w-full h-full">
        <div class="glass-panel p-10 w-full max-w-md rounded-2xl relative z-10 mx-4">
            <h1 class="text-3xl font-bold tracking-tight text-center text-electric mb-8">ADMIN LOGIN</h1>
            <input type="email" id="admin-email" value="00mdhasan321@gmail.com" class="input-dark mb-4">
            <input type="password" id="admin-password" placeholder="Password" class="input-dark mb-6">
            <button id="btn-login" class="w-full bg-electric text-navy font-bold py-3.5 rounded-lg hover:bg-cyan-300">Authorize Access</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-admin" class="hide flex w-full h-full relative">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-40 md:hidden hide" onclick="document.getElementById('sidebar').classList.add('-translate-x-full'); this.classList.add('hide');"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 glass-panel border-r border-gray-800 flex flex-col h-full shrink-0 z-50 absolute md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="h-20 border-b border-gray-800 flex items-center justify-between px-6 shrink-0">
                <span class="font-bold text-lg text-white">NEXORA ADMIN</span>
                <button class="md:hidden text-gray-400" onclick="document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('mobile-overlay').classList.add('hide');"><i data-lucide="x"></i></button>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-6 flex flex-col gap-1 px-3">
                <button class="nav-btn sidebar-item active flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-overview">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span>Overview</span>
                </button>
                <button class="nav-btn sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-catalog">
                    <i data-lucide="bot" class="w-5 h-5"></i> <span>Robots</span>
                </button>
                <button class="nav-btn sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-deposits">
                    <i data-lucide="arrow-down-circle" class="w-5 h-5"></i> <span>Deposits</span> 
                </button>
                <button class="nav-btn sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-withdrawals">
                    <i data-lucide="arrow-up-circle" class="w-5 h-5"></i> <span>Withdrawals</span> 
                </button>
                <button class="nav-btn sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-payments">
                    <i data-lucide="credit-card" class="w-5 h-5"></i> <span>Payment Methods</span>
                </button>
                <button class="nav-btn sidebar-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-left" data-target="v-settings">
                    <i data-lucide="settings" class="w-5 h-5"></i> <span>Settings</span>
                </button>
            </nav>
            <div class="p-4 border-t border-gray-800"><button id="btn-logout" class="w-full py-2 text-danger"><i data-lucide="log-out" class="inline w-4 h-4 mr-2"></i>Logout</button></div>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-midnight overflow-hidden">
            <header class="h-20 border-b border-gray-800 flex items-center px-4 md:px-8 shrink-0 bg-midnight/80 backdrop-blur-md">
                <button class="md:hidden text-white mr-4 p-2" onclick="document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('mobile-overlay').classList.remove('hide');">
                    <i data-lucide="menu"></i>
                </button>
                <h2 id="page-title" class="text-xl font-semibold text-white">Overview</h2>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
                
                <!-- OVERVIEW -->
                <div id="v-overview" class="admin-view flex flex-col gap-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="admin-card p-6 border-t-2 border-electric"><div class="text-textMuted mb-2">Users</div><h3 class="text-3xl font-bold" id="stat-users">0</h3></div>
                        <div class="admin-card p-6 border-t-2 border-emerald"><div class="text-textMuted mb-2">Pending Deposits</div><h3 class="text-3xl font-bold" id="stat-deposits">0</h3></div>
                        <div class="admin-card p-6 border-t-2 border-danger"><div class="text-textMuted mb-2">Pending Withdrawals</div><h3 class="text-3xl font-bold" id="stat-withdrawals">0</h3></div>
                    </div>
                </div>

                <!-- ROBOTS -->
                <div id="v-catalog" class="admin-view hide flex flex-col gap-6">
                    <div class="flex justify-between items-center">
                        <h3 class="font-semibold text-white">Robot Catalog</h3>
                        <button onclick="window.addRobot()" class="bg-electric text-navy px-4 py-2 rounded-lg font-bold text-sm">Add Robot</button>
                    </div>
                    <div class="admin-card overflow-x-auto">
                        <table class="whitespace-nowrap">
                            <thead><tr><th>Name</th><th>Price (৳)</th><th>Duration</th><th>Reward Rate</th><th>Action</th></tr></thead>
                            <tbody id="tb-catalog"></tbody>
                        </table>
                    </div>
                </div>

                <!-- DEPOSITS -->
                <div id="v-deposits" class="admin-view hide flex flex-col gap-6">
                    <div class="admin-card overflow-x-auto">
                        <table class="whitespace-nowrap">
                            <thead><tr><th>UID</th><th>Method</th><th>Ref</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody id="tb-deposits"></tbody>
                        </table>
                    </div>
                </div>

                <!-- WITHDRAWALS -->
                <div id="v-withdrawals" class="admin-view hide flex flex-col gap-6">
                    <div class="admin-card overflow-x-auto">
                        <table class="whitespace-nowrap">
                            <thead><tr><th>UID</th><th>Method</th><th>Dest</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody id="tb-withdrawals"></tbody>
                        </table>
                    </div>
                </div>

                <!-- PAYMENT METHODS -->
                <div id="v-payments" class="admin-view hide flex flex-col gap-6">
                    <div class="flex justify-between items-center">
                        <h3 class="font-semibold text-white">Payment Methods</h3>
                        <button onclick="window.addPaymentMethod()" class="bg-violet text-white px-4 py-2 rounded-lg font-bold text-sm">Add Method</button>
                    </div>
                    <div class="admin-card overflow-x-auto">
                        <table class="whitespace-nowrap">
                            <thead><tr><th>Name</th><th>Type</th><th>Number/Details</th><th>Action</th></tr></thead>
                            <tbody id="tb-payments"></tbody>
                        </table>
                    </div>
                </div>

                <!-- SETTINGS -->
                <div id="v-settings" class="admin-view hide flex flex-col gap-6">
                    <div class="admin-card p-6 max-w-xl">
                        <h3 class="text-lg font-semibold mb-6">Financial Limits & Rewards</h3>
                        <div class="space-y-4">
                            <div><label class="block text-xs text-textMuted mb-1">Minimum Deposit (৳)</label><input type="number" id="set-min-dep" class="input-dark"></div>
                            <div><label class="block text-xs text-textMuted mb-1">Minimum Withdrawal (৳)</label><input type="number" id="set-min-wit" class="input-dark"></div>
                            <div><label class="block text-xs text-textMuted mb-1">7th Day Gift Box Reward (৳)</label><input type="number" id="set-day7-reward" class="input-dark"></div>
                            <button onclick="window.saveSettings()" class="bg-electric text-navy font-bold px-6 py-2 rounded-lg w-full mt-4">Save Configuration</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modals to add Robot and Payment Methods will be injected dynamically or simplified here -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, get, set, push, onValue, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEz88Sx7BdGOQ2ZHG_z_XBKntOhS3XJK8",
            authDomain: "rewardsapp-395d0.firebaseapp.com",
            databaseURL: "https://rewardsapp-395d0-default-rtdb.firebaseio.com",
            projectId: "rewardsapp-395d0",
            storageBucket: "rewardsapp-395d0.firebasestorage.app",
            messagingSenderId: "709199854223",
            appId: "1:709199854223:web:dbed4018e3cd7218530efa"
        };
        const SUPER_ADMIN_UID = "5e5kn6NcJZOwqBwHaQB1fDNgPDz1";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        lucide.createIcons();
        const el = (id) => document.getElementById(id);
        const show = (id) => el(id).classList.remove('hide');
        const hide = (id) => el(id).classList.add('hide');

        window.showToast = (msg, err = false) => {
            const t = el('toast'); el('toast-msg').innerText = msg;
            t.className = `fixed top-6 right-6 z-[200] border px-6 py-4 rounded-xl shadow-xl transition-all duration-300 flex items-center gap-3 ${err ? 'bg-danger/10 border-danger text-danger' : 'bg-card border-gray-700 text-white'}`;
            t.classList.remove('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-[-20px]'), 3000);
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                const t = e.currentTarget; t.classList.add('active');
                document.querySelectorAll('.admin-view').forEach(v => hide(v.id));
                show(t.dataset.target);
                el('page-title').innerText = t.querySelector('span').innerText;
                // auto close drawer on mobile
                el('sidebar').classList.add('-translate-x-full');
                el('mobile-overlay').classList.add('hide');
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === SUPER_ADMIN_UID) {
                hide('view-login'); show('main-admin');
                initData();
            } else if (user) {
                signOut(auth); window.showToast("Unauthorized", true);
            } else {
                show('view-login'); hide('main-admin');
            }
        });

        el('btn-login').onclick = async () => {
            try { await signInWithEmailAndPassword(auth, el('admin-email').value, el('admin-password').value); }
            catch(e) { window.showToast(e.message, true); }
        };
        el('btn-logout').onclick = () => signOut(auth);

        function initData() {
            // Stats & Tables
            onValue(ref(db, 'users'), s => { el('stat-users').innerText = s.exists() ? Object.keys(s.val()).length : 0; });
            
            // Settings
            onValue(ref(db, 'appConfig/walletSettings'), s => {
                if(s.exists()){
                    el('set-min-dep').value = s.val().minDeposit || 100;
                    el('set-min-wit').value = s.val().minWithdraw || 100;
                }
            });
            onValue(ref(db, 'appConfig/rewardSettings'), s => {
                if(s.exists()) el('set-day7-reward').value = s.val().day7Reward || 50;
            });

            // Payment Methods
            onValue(ref(db, 'appConfig/paymentMethods'), s => {
                let html = '';
                if(s.exists()) {
                    s.forEach(c => {
                        let m = c.val();
                        html += `<tr><td>${m.name}</td><td class="uppercase">${m.type}</td><td>${m.number || 'N/A'}</td>
                        <td><button onclick="window.delPayment('${c.key}')" class="text-danger">Delete</button></td></tr>`;
                    });
                }
                el('tb-payments').innerHTML = html;
            });

            // Deposits
            onValue(ref(db, 'depositRequests'), snap => {
                let p = 0; let html = '';
                if(snap.exists()) snap.forEach(user => {
                    user.forEach(req => {
                        let r = req.val(); if(r.status === 'pending') p++;
                        html += `<tr><td class="text-xs text-electric">${user.key.substring(0,8)}</td><td class="uppercase">${r.paymentMethod}</td><td>${r.paymentReference}</td><td class="font-bold text-emerald">${r.amount}</td><td>${r.status}</td>
                        <td>${r.status==='pending'?`<button onclick="window.processFin('deposit','${user.key}','${req.key}',${r.amount},'approved')" class="text-emerald mr-2">Approve</button>`:''}</td></tr>`;
                    });
                });
                el('stat-deposits').innerText = p; el('tb-deposits').innerHTML = html;
            });

            // Withdrawals
            onValue(ref(db, 'withdrawalRequests'), snap => {
                let p = 0; let html = '';
                if(snap.exists()) snap.forEach(user => {
                    user.forEach(req => {
                        let r = req.val(); if(r.status === 'pending') p++;
                        html += `<tr><td class="text-xs text-electric">${user.key.substring(0,8)}</td><td class="uppercase">${r.paymentMethod}</td><td>${r.destinationDetails}</td><td class="font-bold text-danger">${r.amount}</td><td>${r.status}</td>
                        <td>${r.status==='pending'?`<button onclick="window.processFin('withdrawal','${user.key}','${req.key}',${r.amount},'approved')" class="text-electric mr-2">Approve</button>`:''}</td></tr>`;
                    });
                });
                el('stat-withdrawals').innerText = p; el('tb-withdrawals').innerHTML = html;
            });

            // Robots
            onValue(ref(db, 'robotCatalog'), snap => {
                let html = '';
                if(snap.exists()) snap.forEach(r => {
                    let v = r.val();
                    html += `<tr><td>${v.name}</td><td>৳${v.price}</td><td>${v.duration}d</td><td>৳${v.rewardRate}/h</td><td><button onclick="window.delRobot('${r.key}')" class="text-danger">Delete</button></td></tr>`;
                });
                el('tb-catalog').innerHTML = html;
            });
        }

        window.saveSettings = async () => {
            await update(ref(db, 'appConfig/walletSettings'), { minDeposit: parseInt(el('set-min-dep').value), minWithdraw: parseInt(el('set-min-wit').value) });
            await update(ref(db, 'appConfig/rewardSettings'), { day7Reward: parseInt(el('set-day7-reward').value) });
            window.showToast("Settings Saved Successfully");
        };

        window.addPaymentMethod = async () => {
            const name = prompt("Enter Method Name (e.g. bKash):"); if(!name) return;
            const type = prompt("Type ('deposit' or 'withdraw'):"); if(!type) return;
            const num = prompt("Enter Number (or leave blank):");
            await push(ref(db, 'appConfig/paymentMethods'), { name, type: type.toLowerCase(), number: num });
        };
        window.delPayment = async (id) => await remove(ref(db, `appConfig/paymentMethods/${id}`));

        window.addRobot = async () => {
            const name = prompt("Robot Name:"); if(!name) return;
            const price = parseFloat(prompt("Price (৳):"));
            const dur = parseInt(prompt("Duration (Days):"));
            const rate = parseFloat(prompt("Reward/hr (৳):"));
            await push(ref(db, 'robotCatalog'), { name, price, duration: dur, rewardRate: rate, enabled: true });
        };
        window.delRobot = async (id) => await remove(ref(db, `robotCatalog/${id}`));

        window.processFin = async (type, uid, reqId, amount, status) => {
            if(!confirm(`Approve this ${type}?`)) return;
            const p = type === 'deposit' ? 'depositRequests' : 'withdrawalRequests';
            await update(ref(db, `${p}/${uid}/${reqId}`), { status });
            
            if(status === 'approved') {
                const wRef = ref(db, `wallets/${uid}`);
                const snap = await get(wRef);
                let bal = snap.exists() ? snap.val().cachedBalance : 0;
                if(type === 'deposit') bal += amount;
                else bal -= amount; // (Assuming not deducted on request for simplicity in this flow)
                
                await update(wRef, { cachedBalance: bal });
                await push(ref(db, `walletTransactions/${uid}`), { type, amount, status: 'successful', createdAt: serverTimestamp() });
            }
        };
    </script>
</body>
</html>
